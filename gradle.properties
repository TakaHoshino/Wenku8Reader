# 堆上限在 AGP 9 + miuix 下仍够用（本机页面文件较小，过大反而会在提交内存不足时启动失败）；
# Kotlin 编译改在 Gradle 进程内执行，少起一个 JVM（CI 上同样更快、内存更省）。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 默认把"多个依赖共用同一 namespace"当作错误。cronet-embedded / cronet-api /
# cronet-common 三者都声明 org.chromium.net（官方打包方式如此），而 Cronet 的 API 类确实在
# cronet-api 里、实现类在 cronet-embedded 里，缺一不可，只能关闭该校验。
android.uniquePackageNames=false
kotlin.code.style=official

# ---- 本地构建回退版本（CI 构建由环境变量覆盖，见 VERSIONING.md）----
VERSION_NAME=1.0.0
VERSION_CODE=10000
