name: Parse Next Version
description: >-
  解析最近 vX.Y.Z 标签之后的 Conventional Commits，计算下一个语义化版本号。
  release（main/master）与 dev 分支共用此规则，保证两边 versionName 一致。
outputs:
  skip:
    description: 'true = 无 feat/fix/breaking 提交（版本不变）'
  version:
    description: 下一个版本号（skip 时 = 当前版本，仍可作 versionName 使用）
  bump:
    description: major / minor / patch / none
  last_tag:
    description: 上一个版本标签（无标签时为空）
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # 上一个 vX.Y.Z 标签；无标签则从 0.0.0 起算
        LAST_TAG="$(git tag --list 'v*' | sort -V | tail -n 1 || true)"
        BASE="${LAST_TAG#v}"
        BASE="${BASE:-0.0.0}"
        RANGE="HEAD"
        if [ -n "$LAST_TAG" ]; then RANGE="${LAST_TAG}..HEAD"; fi

        # 升级类型判断（优先级：breaking > feat > fix）
        if git log "$RANGE" --format=%B | grep -qE '^BREAKING CHANGE|!(:|\s)'; then
          BUMP="major"
        elif git log "$RANGE" --format=%s | grep -qE '^feat(\([^)]*\))?!?:'; then
          BUMP="minor"
        elif git log "$RANGE" --format=%s | grep -qE '^fix(\([^)]*\))?!?:'; then
          BUMP="patch"
        else
          BUMP="none"
        fi

        if [ "$BUMP" = "none" ]; then
          # 无版本相关提交：skip=true，version 回退为当前版本（构建仍可用）
          echo "skip=true"       >> "$GITHUB_OUTPUT"
          echo "version=${BASE}" >> "$GITHUB_OUTPUT"
          echo "bump=none"       >> "$GITHUB_OUTPUT"
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        IFS='.' read -r BM BA BP <<< "$BASE"
        case "$BUMP" in
          major) NM=$((BM + 1)); NA=0; NP=0 ;;
          minor) NM=$BM;        NA=$((BA + 1)); NP=0 ;;
          patch) NM=$BM;        NA=$BA;         NP=$((BP + 1)) ;;
        esac
        NEXT="${NM}.${NA}.${NP}"

        echo "skip=false"       >> "$GITHUB_OUTPUT"
        echo "version=${NEXT}"  >> "$GITHUB_OUTPUT"
        echo "bump=${BUMP}"     >> "$GITHUB_OUTPUT"
        echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
