# 开发分支（dev）构建工作流
# - 触发：push 到 dev 分支，或手动 workflow_dispatch
# - 行为：仅构建 Release APK 并作为 Actions Artifact 上传
#   · versionCode  = github.run_number（每次运行唯一且递增）
#   · versionName  = gradle.properties 默认值（不解析提交、不递增）
#   · 不打 git tag、不创建 GitHub Release
# - 产物下载：Actions 页面 → 选中本次运行 → Artifacts（右上角）
name: Dev Build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # job 级 env：让步骤 if 条件可检查签名密钥（secrets 不能直接在 if 中引用）
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---- 正式签名（可选）：配置了 KEYSTORE_BASE64 才启用，否则回退 debug 签名 ----
      - name: 准备正式签名（还原 keystore）
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # ---- 构建 ----
      # 不设置 APP_VERSION_NAME → 使用 gradle.properties 默认版本名（不递增）；
      # versionCode 用「时间基准」yyyymmddHH：跨工作流单调递增、必然大于任何历史已装版本，
      # 避免按 run_number（各工作流独立计数，从 1 开始）导致的降级安装失败。
      - name: 计算递增 versionCode（时间基准）
        id: version
        run: echo "version_code=$(date +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          # gradlew 在 Windows 上创建，Linux runner 需补可执行位
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      # ---- 上传产物（仅 Artifact，不发布 Release）----
      - name: 上传 APK（Actions Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
