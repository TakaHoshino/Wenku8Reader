# 开发分支（dev）构建工作流
# - 触发：push 到 dev 分支，或手动 workflow_dispatch；纯文档/图标改动不触发
# - 行为：构建 Release APK 并作为 Actions Artifact 上传，不发布 Release
#   · versionName = 与 master 同一套语义版本系统（内联解析 Conventional Commits）
#   · versionCode = 时间基准 yyyymmddHH（跨工作流单调递增，必然大于历史已装版本）
#   · 不打 git tag、不创建 GitHub Release
# - 产物下载：Actions 页面 → 选中本次运行 → Artifacts（右上角）
name: Dev Build

on:
  push:
    branches: [dev]
    # 纯文档/图标等不影响产物的改动不触发构建
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'app_icon*.png'
  workflow_dispatch:

permissions:
  contents: write   # 发布测试版 Prerelease 需要

jobs:
  build:
    runs-on: ubuntu-latest
    # job 级 env：让步骤 if 条件可检查签名密钥（secrets 不能直接在 if 中引用）
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整历史，供语义版本解析使用

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---- 语义版本号：与 master 同一套规则（解析最近 tag 之后的 Conventional Commits）----
      # 注意：必须用内联 run 步骤写 $GITHUB_OUTPUT——composite action 的输出
      # 在此环境不生效（曾导致 versionName 为空、release tag 变成 "v"）。
      - name: 解析下一个版本
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 上一个正式版 vX.Y.Z 标签；无标签则从 0.0.0 起算。
          # 必须排除 prerelease 标签（vX.Y.Z-dev.N，含 "-"）——否则 dev 测试版 tag 会
          # 被当作基准，版本号随每次构建虚高（0.2.0 → 0.3.0-dev → 0.4.0-dev）。
          LAST_TAG="$(git tag --list 'v*' | grep -v -- '-' | sort -V | tail -n 1 || true)"
          BASE="${LAST_TAG#v}"
          BASE="${BASE:-0.0.0}"
          RANGE="HEAD"
          if [ -n "$LAST_TAG" ]; then RANGE="${LAST_TAG}..HEAD"; fi

          if git log "$RANGE" --format=%B | grep -qE '^BREAKING CHANGE|!(:|\s)'; then
            BUMP="major"
          elif git log "$RANGE" --format=%s | grep -qE '^feat(\([^)]*\))?!?:'; then
            BUMP="minor"
          elif git log "$RANGE" --format=%s | grep -qE '^(fix|perf)(\([^)]*\))?!?:'; then
            BUMP="patch"
          else
            BUMP="none"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "skip=true"       >> "$GITHUB_OUTPUT"
            echo "version=${BASE}" >> "$GITHUB_OUTPUT"
            echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r BM BA BP <<< "$BASE"
          case "$BUMP" in
            major) NM=$((BM + 1)); NA=0; NP=0 ;;
            minor) NM=$BM;        NA=$((BA + 1)); NP=0 ;;
            patch) NM=$BM;        NA=$BA;         NP=$((BP + 1)) ;;
          esac
          NEXT="${NM}.${NA}.${NP}"

          echo "skip=false"       >> "$GITHUB_OUTPUT"
          echo "version=${NEXT}"  >> "$GITHUB_OUTPUT"
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"

      # ---- 正式签名（可选）：配置了 KEYSTORE_BASE64 才启用，否则回退 debug 签名 ----
      - name: 准备正式签名（还原 keystore）
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # ---- 构建 ----
      # versionName 用语义解析结果（与 master 一致）；versionCode 用时间基准 yyyymmddHH，
      # 跨工作流单调递增、必然大于任何历史已装版本（避免 run_number 从 1 开始导致的降级安装失败）。
      - name: 计算递增 versionCode（时间基准）
        id: vcode
        run: echo "version_code=$(date +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        env:
          # versionName 带 -dev.<run_number> 后缀，与下面发布的 Prerelease 标签（vX.Y.Z-dev.N）一致，
          # 避免「装了测试版却显示正式版号 0.3.0」的无效更新混淆；解析结果为空时回退 1.0.0-dev.N
          APP_VERSION_NAME: ${{ steps.version.outputs.version != '' && format('{0}-dev.{1}', steps.version.outputs.version, github.run_number) || format('1.0.0-dev.{0}', github.run_number) }}
          APP_VERSION_CODE: ${{ steps.vcode.outputs.version_code }}
        run: |
          echo "构建版本 → name=${APP_VERSION_NAME:-<空>} code=${APP_VERSION_CODE:-<空>}"
          # gradlew 在 Windows 上创建，Linux runner 需补可执行位
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      # ---- 上传产物（Artifact + GitHub Prerelease）----
      # Artifact 供仓库内下载；Prerelease 供应用「测试版」通道检查更新
      #（Actions Artifact 无法匿名下载，测试版更新必须走 Release 资产）。
      - name: 上传 APK（Actions Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 发布测试版 Prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-dev.${{ github.run_number }}
          name: v${{ steps.version.outputs.version }}-dev.${{ github.run_number }}（测试版）
          body: |
            versionCode: ${{ steps.vcode.outputs.version_code }}

            自动构建的测试版（Actions）。
            请在应用「设置 → 更新 → 更新通道」选择「测试版」后检查更新。
          prerelease: true
          files: |
            app/build/outputs/apk/release/app-release.apk
