# 自动化版本发布（详见 VERSIONING.md）
# - 触发：push 到 main/master，或手动 workflow_dispatch
# - 版本：解析 Conventional Commits 自动升级（feat→minor，fix/perf→patch，BREAKING→major）
# - versionCode：2_030_000_000 + 自 2026-01-01 UTC 起的分钟数（跨工作流单调递增，
#   必然大于任何历史已装版本；分钟粒度避免同小时撞号，见 VERSIONING.md §2）
# - 产出：打 git tag vX.Y.Z + GitHub Release（含 APK、SHA256SUMS 与自动生成更新日志）
#
# 安全设计（对应 CI 安全评审）：
# 1. 签名密钥与写权限**分离到两个 job**：build 只读 + 用密钥签名；publish 只写 + 不接触密钥。
#    这样即使构建链（Gradle/依赖/插件）被投毒，攻击者也拿不到「签名密钥 + contents:write」的组合。
# 2. 签名密钥放在受保护环境 `release` 下（建议配置 Required reviewers + 仅允许 main/master 部署）。
# 3. 密钥绝不放在 job 级 env、也绝不经 $GITHUB_ENV 传播，只在「校验/还原/构建/验签」几步内按需注入。
# 4. 所有第三方 Action 固定到完整 commit SHA（浮动 tag 可被移动/投毒）。
# 5. 无正式签名密钥时**直接失败**，不再回退 debug 签名发布。
# 6. 构建后用 apksigner 校验 APK 签名证书与我们的 keystore 一致，并产出 SHA256SUMS。
name: Release

on:
  push:
    branches: [main, master]
    # 纯文档/图标等不影响产物的改动不触发（注意用 **/ 以覆盖子目录文档）
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'app_icon*.png'
  workflow_dispatch:

# 顶层最小权限：写权限只授予真正需要的 publish job
permissions:
  contents: read

# 串行发布：避免并发打 tag / 同小时 versionCode 冲突
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  # 构建 + 签名：只读权限，接触签名密钥
  # ------------------------------------------------------------------ #
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 签名密钥所在的保护环境（建议：Required reviewers + Deployment branches 仅 main/master）
    environment: release
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.vcode.outputs.version_code }}
      last_tag: ${{ steps.version.outputs.last_tag }}
    steps:
      - name: Checkout（完整历史，供提交解析与打标签）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # 不把 GITHUB_TOKEN 写进本地 git config：后续构建步骤即使被投毒也无法直接复用凭据
          persist-credentials: false

      - name: 校验 Gradle Wrapper
        # 防止被替换过的 gradle-wrapper.jar 在构建时执行任意代码
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # ---- 语义化版本升级：解析最近一次 tag 之后的 Conventional Commits ----
      # 注意：必须用内联 run 步骤写 $GITHUB_OUTPUT——composite action 的输出
      # 在此环境不生效（曾导致 tag 变成 "v"、versionName 为空）。
      - name: 解析下一个版本
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 上一个正式版 vX.Y.Z 标签；无标签则从 0.0.0 起算。
          # 必须排除 prerelease 标签（vX.Y.Z-dev.N，含 "-"）——否则 dev 测试版 tag 会
          # 被当作基准，版本号随每次构建虚高（0.2.0 → 0.3.0-dev → 0.4.0-dev）。
          LAST_TAG="$(git tag --list 'v*' | grep -v -- '-' | sort -V | tail -n 1 || true)"
          BASE="${LAST_TAG#v}"
          BASE="${BASE:-0.0.0}"
          RANGE="HEAD"
          if [ -n "$LAST_TAG" ]; then RANGE="${LAST_TAG}..HEAD"; fi

          # 基准必须是严格的 X.Y.Z，否则后面的算术会静默算错
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::基准版本格式非法：'$BASE'（来自 tag '$LAST_TAG'），应为 X.Y.Z"
            exit 1
          fi

          # 升级类型判断（优先级：breaking > feat > fix/perf）
          # breaking 只认规范写法：subject 中的 `<type>!:`，或正文中以 BREAKING CHANGE 开头的行。
          # 切勿用未锚定的 `!` 匹配：提交正文里的代码片段会被误判成重大变更
          #（曾把一次纯 patch 变更误发成主版本 v0.6.1 → v1.0.0）。
          # 注意 `git log --format=%B` 会给正文加 4 空格缩进，故正文匹配需容忍前导空白。
          if git log "$RANGE" --format=%s | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' \
             || git log "$RANGE" --format=%B | grep -qE '^[[:space:]]*BREAKING[ -]CHANGE:'; then
            BUMP="major"
          elif git log "$RANGE" --format=%s | grep -qE '^feat(\([^)]*\))?!?:'; then
            BUMP="minor"
          elif git log "$RANGE" --format=%s | grep -qE '^(fix|perf)(\([^)]*\))?!?:'; then
            BUMP="patch"
          else
            BUMP="none"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "本次提交无 feat/fix/breaking 变更，跳过发布"
            echo "skip=true"        >> "$GITHUB_OUTPUT"
            echo "version=${BASE}"  >> "$GITHUB_OUTPUT"
            echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r BM BA BP <<< "$BASE"
          case "$BUMP" in
            major) NM=$((BM + 1)); NA=0; NP=0 ;;
            minor) NM=$BM;        NA=$((BA + 1)); NP=0 ;;
            patch) NM=$BM;        NA=$BA;         NP=$((BP + 1)) ;;
          esac
          NEXT="${NM}.${NA}.${NP}"

          echo "skip=false"        >> "$GITHUB_OUTPUT"
          echo "version=${NEXT}"   >> "$GITHUB_OUTPUT"
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          echo "上一版本=${BASE:-无}  本次升级=${BUMP}  新版本=${NEXT}"

      - name: 跳过发布（无版本相关提交）
        if: steps.version.outputs.skip == 'true'
        run: echo "本次推送不包含 feat/fix/breaking 提交，不触发版本发布。"

      - name: 设置 JDK 17
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # AGP 9 / Gradle 9.7 工具链（见 DEVELOPMENT.md §5.6）
          java-version: 21

      # ---- 签名密钥：必须存在，否则直接失败（不再回退 debug 签名）----
      - name: 校验签名密钥已配置
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::未配置正式签名密钥（KEYSTORE_BASE64），拒绝发布 debug 签名或未签名 APK。配置步骤见 VERSIONING.md §6。"
            exit 1
          fi

      - name: 还原签名密钥
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      # ---- 构建：versionName 由语义解析注入，versionCode 用**分钟**基准 ----
      # 编码：versionCode = 2_030_000_000 + 自 2026-01-01 00:00 UTC 起的分钟数
      # （与 dev.yml 完全同一套：跨工作流单调递增、必然大于任何历史已装版本，
      #   且同一小时内多次构建也能区分先后。为什么不是 yyyyMMddHHmm：versionCode
      #   是 32 位 int，拼时间必然溢出，详见 VERSIONING.md §2）
      - name: 计算递增 versionCode（分钟基准）
        if: steps.version.outputs.skip != 'true'
        id: vcode
        run: |
          set -euo pipefail
          EPOCH="$(date -u -d '2026-01-01T00:00:00Z' +%s)"
          NOW="$(date -u +%s)"
          CODE=$(( 2030000000 + (NOW - EPOCH) / 60 ))
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "构建时间（UTC）：$(date -u '+%Y-%m-%d %H:%M') → versionCode=${CODE}"

      - name: 构建 Release APK
        if: steps.version.outputs.skip != 'true'
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.vcode.outputs.version_code }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # gradlew 在 Windows 上创建，Linux runner 需补可执行位
          chmod +x gradlew
          # 发布前必须先过单元测试：纯 JVM 用例，成本几秒到几十秒，
          # 但能挡住解析/命名/清理这类"静默出错"的回归（此前 CI 从不跑测试）。
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      # ---- 产物校验：APK 签名证书必须与我们的 keystore 一致 ----
      - name: 校验 APK 签名并生成校验和
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          APK="$OUT/app-release.apk"

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner（ANDROID_SDK_ROOT=$SDK），无法校验 APK 签名"
            exit 1
          fi

          # 统一小写并去掉冒号后再比较指纹。
          # 用 sed 贪婪匹配到 "SHA-256 digest:" 之后的内容，而不是按 ': ' 切分字段：
          # apksigner 的输出格式随版本/平台不同（有的会在 `Signer #1` 后也带一个冒号），
          # 按字段切分会取到 "certificate SHA-256 digest" 这种错误值（实测踩过）。
          norm() { tr -d ':' | tr 'A-Z' 'a-z'; }
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -n 1 | norm)"
          EXPECTED="$(keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/.*SHA256:[[:space:]]*//p' | head -n 1 | norm)"

          if [ "${#ACTUAL}" -ne 64 ] || [ "${#EXPECTED}" -ne 64 ]; then
            echo "::error::签名指纹长度异常（actual=${#ACTUAL} expected=${#EXPECTED}，应为 64）"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK 签名证书与 keystore 不一致，拒绝发布"
            exit 1
          fi
          echo "签名证书 SHA-256：$ACTUAL"

          cd "$OUT"
          sha256sum app-release.apk > SHA256SUMS
          cat SHA256SUMS

      - name: 上传构建产物
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: 清理签名密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  # ------------------------------------------------------------------ #
  # 发布：只写权限，不接触任何签名密钥
  # ------------------------------------------------------------------ #
  publish:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout（生成更新日志需要 git 历史）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-apk
          path: dist

      - name: 生成更新日志（自上次标签，含 versionCode 供应用按 code 比较更新）
        id: changelog
        shell: bash
        env:
          LAST_TAG: ${{ needs.build.outputs.last_tag }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          set -euo pipefail
          RANGE="HEAD"
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; fi
          # 首行写入 versionCode（应用更新检查以此为准，严格单调递增）
          {
            echo "versionCode: $VERSION_CODE"
            echo ""
            echo "### 新增"
            git log "$RANGE" --format=%s | grep -E '^feat' \
              | sed -E 's/^feat(\([^)]*\))?!?:? ?//' | sed 's/^/- /' || true
            echo ""
            echo "### 修复"
            git log "$RANGE" --format=%s | grep -E '^fix' \
              | sed -E 's/^fix(\([^)]*\))?!?:? ?//' | sed 's/^/- /' || true
          } > /tmp/changelog.md
          if ! grep -qE '^- ' /tmp/changelog.md; then
            echo "- 详见提交记录" >> /tmp/changelog.md
          fi
          # 随机分隔符，避免正文出现固定 EOF 破坏 GITHUB_OUTPUT
          DELIM="CHANGELOG_EOF_$(openssl rand -hex 12)"
          { echo "body<<$DELIM"; cat /tmp/changelog.md; echo "$DELIM"; } >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          # 显式指定打标签的目标提交，避免默认落到默认分支 HEAD
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/app-release.apk
            dist/SHA256SUMS
