name: Bug 报告
description: 报告应用中的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提交 Bug 报告！请尽可能详细地填写以下信息，以便我们快速定位和修复问题。

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 请在「设置 → 关于」中查看版本号
      placeholder: "例如：1.0.0"
    validations:
      required: true

  - type: dropdown
    id: android_version
    attributes:
      label: Android 版本
      options:
        - "Android 8.0 (API 26)"
        - "Android 9.0 (API 28)"
        - "Android 10 (API 29)"
        - "Android 11 (API 30)"
        - "Android 12 (API 31)"
        - "Android 13 (API 33)"
        - "Android 14 (API 34)"
        - "Android 15 (API 35)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请详细描述您遇到的问题
      placeholder: "例如：在搜索页面输入关键词后，点击搜索按钮没有反应"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供可以重现问题的详细步骤
      placeholder: |
        1. 打开应用
        2. 点击 '探索' 页面
        3. 在搜索框输入 'xxx'
        4. 点击搜索按钮
        5. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 请描述您期望的正确行为
      placeholder: "例如：应该显示搜索结果列表"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 如果可能，请提供问题截图或录屏
      placeholder: "拖拽图片到此处或点击上传"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他可能有助于诊断问题的信息
      placeholder: "例如：设备型号、网络环境等"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索过现有 Issue，确认这是一个未被报告过的问题
          required: true
        - label: 我确认以上信息填写完整且准确
          required: true
