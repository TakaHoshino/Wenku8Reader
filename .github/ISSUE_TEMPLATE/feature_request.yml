name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出功能建议！您的反馈对我们非常重要。

  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: 请描述您希望解决的问题或满足的需求
      placeholder: "例如：每次搜索都需要手动输入完整的书名，很不方便"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 请描述您希望实现的功能
      placeholder: "例如：希望在搜索框下方增加搜索历史记录，方便快速选择之前搜索过的关键词"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 如果有其他替代方案，请在此描述
      placeholder: "例如：也可以考虑增加搜索建议/自动补全功能"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他可能有助于理解此功能建议的信息
      placeholder: "例如：参考其他应用的实现方式"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索过现有 Issue，确认这是一个未被提出的建议
          required: true
        - label: 我确认以上信息填写完整且准确
          required: true
